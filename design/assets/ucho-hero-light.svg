<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-labelledby="t d">
  <title id="t">Ucho</title>
  <desc id="d">Local, private meeting transcription and dictation</desc>
  <style>
    .ucho { fill: none; stroke: #DF9C86; stroke-width: 13; stroke-linecap: round; stroke-linejoin: round; }
    .wewn { fill: none; stroke: #B0644E; stroke-width: 11; stroke-linecap: round; }
    .fala { fill: none; stroke: #DF9C86; stroke-width: 8; stroke-linecap: round; opacity: 0; animation: fala 2.4s cubic-bezier(.22,1,.36,1) infinite; }
    .f1 { animation-delay: 0s; } .f2 { animation-delay: .35s; } .f3 { animation-delay: .7s; }
    @keyframes fala { 0% { opacity: 0; } 25% { opacity: .9; } 70% { opacity: 0; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .fala { animation: none; opacity: .7; } }
  
    .nazwa { font: 600 96px "Iowan Old Style", Charter, "Sitka Heading", Georgia, serif; fill: #2A211E; letter-spacing: -1px; }
    .hasło { font: 400 24px "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #675C55; }
    .wymowa { font: italic 400 22px "Iowan Old Style", Charter, Georgia, serif; fill: #675C55; }
  </style>
  <g transform="translate(20 20)">
  <path class="fala f1" d="M 52 70 A 58 58 0 0 0 52 130"/>
  <path class="fala f2" d="M 68 80 A 38 38 0 0 0 68 120"/>
  <path class="fala f3" d="M 82 89 A 18 18 0 0 0 82 111"/>
  <path class="ucho" d="M 92 70 C 92 44 112 28 134 28 C 160 28 178 48 178 74 C 178 96 164 104 158 118 C 152 132 154 150 136 160 C 124 166 110 160 108 150"/>
  <path class="wewn" d="M 116 76 C 116 62 126 54 136 54 C 148 54 156 64 156 74 C 156 86 144 90 138 98 C 132 106 136 116 126 120"/>
  </g>
  <text class="nazwa" x="250" y="128">Ucho</text>
  <text class="wymowa" x="476" y="126">/oo-ho/ · ear</text>
  <text class="hasło" x="254" y="178">Private transcripts of your meetings and dictation. Offline.</text>
</svg>
