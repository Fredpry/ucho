# TEMPORARY: macOS CI spike for task M3a (issue #22), see tools/macos_spike/README.md.
# Answers yes/no questions about macOS runners before the macOS tasks start. Runs only
# for the spike branch and on manual dispatch; ci.yml and release.yml are untouched.
# Delete once M3b has its own macos.yml.
name: macOS spike (temporary)

on:
  push:
    branches: [macos/m3a]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      SPIKE_RUNNER: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Output folder
        run: echo "SPIKE_OUT=$RUNNER_TEMP/spike" >> "$GITHUB_ENV"
      - name: Install wheels (binary only, pinned)
        continue-on-error: true
        run: |
          mkdir -p "$SPIKE_OUT"
          PKGS="openvino==2026.4.1 openvino-genai==2026.4.1.0 openvino-tokenizers==2026.4.1.0
            huggingface_hub==1.30.0 sounddevice==0.5.6 pywhispercpp==1.5.1 catap==0.6.1
            pyobjc-framework-Cocoa==13.0 pyobjc-framework-Quartz==13.0
            pyobjc-framework-ApplicationServices==13.0 pyobjc-framework-AVFoundation==13.0
            pyobjc-framework-CoreAudio==13.0 sherpa-onnx==2.0.1 sherpa-onnx-core==2.0.1
            soxr==1.1.0 soundfile==0.14.0 numpy==2.5.4 customtkinter==6.0.0 pillow==13.0.0
            pystray==0.19.5 pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.10"
          start=$(date +%s)
          if python -m pip install --only-binary=:all: --report "$SPIKE_OUT/pip-report.json" $PKGS \
               > "$SPIKE_OUT/pip-install.log" 2>&1; then
            echo ok > "$SPIKE_OUT/pip-status.txt"
          else
            echo "failed (see pip-each.txt)" > "$SPIKE_OUT/pip-status.txt"
            tail -40 "$SPIKE_OUT/pip-install.log"
            for p in $PKGS; do
              if python -m pip install --only-binary=:all: "$p" >> "$SPIKE_OUT/pip-install.log" 2>&1; then
                echo "$p ok"
              else
                echo "$p FAILED"
              fi
            done > "$SPIKE_OUT/pip-each.txt"
            cat "$SPIKE_OUT/pip-each.txt"
          fi
          echo $(( $(date +%s) - start )) > "$SPIKE_OUT/install-seconds.txt"
          cat "$SPIKE_OUT/pip-status.txt"
      - name: Checks
        continue-on-error: true
        run: python tools/macos_spike/spike.py all --out "$SPIKE_OUT"
      - name: Summary
        if: always()
        run: python tools/macos_spike/spike.py summary --out "$SPIKE_OUT"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: spike-${{ matrix.os }}
          path: ${{ runner.temp }}/spike
          retention-days: 30
