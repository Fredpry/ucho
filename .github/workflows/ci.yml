name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest ruff numpy==2.5.3 soundfile==0.14.0
      - name: Lint
        run: python -m ruff check .
      - name: SPDX headers
        run: python tools/set_copyright.py --check
      - name: Tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q
      - name: Installer is ASCII only (PowerShell 5.1)
        shell: pwsh
        run: |
          $bad = Select-String -Path install.ps1 -Pattern '[^\x00-\x7F]'
          if ($bad) { $bad; exit 1 }

  gui-smoke:
    # Starts the full UI (wizard, every screen, both layouts and themes) with
    # the real dependencies, without audio capture and without a model, and
    # fails when anything logged an error. The runner has no audio devices,
    # which the app must survive.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app dependencies
        run: python -m pip install -r requirements.txt
      - name: GUI start test
        env:
          PYTHONIOENCODING: utf-8
        run: python -m ucho --smoke-test 3
