name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest ruff numpy==2.5.3 soundfile==0.14.0
      - name: Lint
        run: python -m ruff check .
      - name: SPDX headers
        run: python tools/set_copyright.py --check
      - name: Tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q
      - name: Installer scripts are ASCII only (PowerShell 5.1, cmd.exe)
        shell: pwsh
        run: |
          $bad = Select-String -Path install.ps1, uninstall.ps1, install.cmd, uninstall.cmd -Pattern '[^\x00-\x7F]'
          if ($bad) { $bad; exit 1 }

  gui-smoke:
    # Starts the full UI (wizard, every screen, both layouts and themes) with
    # the real dependencies, without audio capture and without a model, and
    # fails when anything logged an error. The runner has no audio devices,
    # which the app must survive.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install app dependencies
        run: python -m pip install -r requirements.txt
      - name: GUI start test
        env:
          PYTHONIOENCODING: utf-8
        run: python -m ucho --smoke-test 3

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pillow==13.0.0
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $expected = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
          $exe = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          $actual = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "SHA256 mismatch for Inno Setup: expected $expected, got $actual"
          }
          $proc = Start-Process -FilePath $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "Inno Setup installer exited with code $($proc.ExitCode)"
          }
      - name: Build installer
        run: python tools/build_package.py --installer
      - name: Verify installer output
        shell: pwsh
        run: |
          if (-not (Test-Path dist\Ucho-Setup.exe)) {
            throw "dist\Ucho-Setup.exe was not created"
          }
