name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tests
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install pytest numpy==2.5.3 soundfile==0.14.0
          python -m pytest -q
      - name: Build package
        run: python tools/build_package.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/Ucho-Windows.zip dist/SHA256SUMS.txt --title "Ucho ${{ github.ref_name }}" --generate-notes
